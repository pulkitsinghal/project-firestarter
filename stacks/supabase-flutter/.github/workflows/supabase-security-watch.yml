name: Supabase security watch

# Watches the live Cloud project, which migration-only guards cannot see. A fresh
# stamp stays inert until SUPABASE_PROJECT_REF is configured. Once enabled, API
# blindness is a red run plus one canonical unhealthy issue—never a clean result.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/supabase-security-watch.mjs"
      - ".github/workflows/supabase-security-watch.yml"

permissions:
  contents: read

concurrency:
  group: supabase-security-watch
  cancel-in-progress: false

env:
  FINDINGS_TITLE: "[security-watch] Supabase critical advisor findings"
  HEALTH_TITLE: "[security-watch] Supabase watcher unhealthy"

jobs:
  test-parser:
    name: Test advisor classification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Exercise clean, actionable, and malformed responses
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' '{"lints":[{"level":"ERROR","cache_key":"rls_disabled_in_public_public_spatial_ref_sys","title":"Reviewed infrastructure exception"}]}' > "$tmp/clean.json"
          node .github/scripts/supabase-security-watch.mjs "$tmp/clean.json" "$tmp/clean-result.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='clean'||r.totals.ignoredErrors!==1) process.exit(1)" "$tmp/clean-result.json"
          printf '%s\n' '{"lints":[{"level":"ERROR","cache_key":"new_critical","title":"New critical finding","detail":"requires action","metadata":{"schema":"public","name":"example"}}]}' > "$tmp/actionable.json"
          node .github/scripts/supabase-security-watch.mjs "$tmp/actionable.json" "$tmp/actionable-result.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='action_required'||r.findings[0].entity!=='example') process.exit(1)" "$tmp/actionable-result.json"
          printf '%s\n' 'not-json' > "$tmp/malformed.json"
          node .github/scripts/supabase-security-watch.mjs "$tmp/malformed.json" "$tmp/malformed-result.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='unhealthy') process.exit(1)" "$tmp/malformed-result.json"
          printf '%s\n' '{"lints":[{"level":"ERROR","title":"missing cache key"}]}' > "$tmp/malformed-lint.json"
          node .github/scripts/supabase-security-watch.mjs "$tmp/malformed-lint.json" "$tmp/malformed-lint-result.json"
          node -e "const r=require(process.argv[1]); if(r.status!=='unhealthy') process.exit(1)" "$tmp/malformed-lint-result.json"

  scan:
    name: Scan and coordinate
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_REF != ''
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Supabase Security Advisor
        id: fetch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            printf '%s\n' '{"watcher_error":"SUPABASE_ACCESS_TOKEN secret is missing"}' > advisor.json
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --output advisor.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" --header 'Accept: application/json' \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors/security" || true)"
          if [ "$status" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            printf '{"watcher_error":"Supabase advisor returned HTTP %s"}\n' "$status" > advisor.json
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify findings
        shell: bash
        run: |
          if ! node .github/scripts/supabase-security-watch.mjs advisor.json watch-result.json; then
            jq -n --arg dashboard "https://supabase.com/dashboard/project/${SUPABASE_PROJECT_REF}/advisors/security" \
              '{status:"unhealthy",reason:"Advisor classifier crashed",dashboardUrl:$dashboard}' > watch-result.json
          fi
      - name: Mark fetch failure unhealthy
        if: steps.fetch.outputs.ok != 'true'
        shell: bash
        run: |
          reason="$(jq -r '.watcher_error // "Supabase advisor fetch failed"' advisor.json)"
          jq -n --arg reason "$reason" --arg dashboard "https://supabase.com/dashboard/project/${SUPABASE_PROJECT_REF}/advisors/security" \
            '{status:"unhealthy",reason:$reason,dashboardUrl:$dashboard}' > watch-result.json
      - name: Reconcile canonical issues
        uses: actions/github-script@v7
        env:
          RESULT_PATH: watch-result.json
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const { owner, repo } = context.repo;
            const safe = (value) => String(value ?? '').replace(/[|`<>\r\n]/g, ' ').trim();
            const guidance = (value) => {
              try { const url = new URL(value); return ['https:', 'http:'].includes(url.protocol) ? url.href : result.dashboardUrl; }
              catch { return result.dashboardUrl; }
            };
            async function ensureLabel(name, color, description) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            async function findOpen(title) {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              return issues.find((issue) => !issue.pull_request && issue.title === title);
            }
            async function closeCanonical(title, note) {
              const issue = await findOpen(title);
              if (!issue) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: note });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
            await ensureLabel('security-watch', 'b60205', 'Owned by the recurring Supabase security watcher');
            if (result.status === 'unhealthy') {
              const title = process.env.HEALTH_TITLE;
              const body = ['## Supabase security watcher is unhealthy', '', `**Reason:** ${safe(result.reason)}`, '',
                `Dashboard: ${result.dashboardUrl}`, `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '', '_Canonical owner task: update this issue rather than opening a duplicate._'].join('\n');
              const existing = await findOpen(title);
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner, repo, title, body, labels: ['security-watch'] });
              core.setFailed(safe(result.reason));
              return;
            }
            await closeCanonical(process.env.HEALTH_TITLE, `Recovered on ${result.checkedAt}; the advisor is reachable again.`);
            if (result.status === 'clean') {
              await closeCanonical(process.env.FINDINGS_TITLE, `Clean advisor scan on ${result.checkedAt}; no non-baselined ERROR findings remain.`);
              await core.summary.addHeading('Supabase security watch: clean').addRaw(`Checked ${result.totals.all} lints.`).write();
              return;
            }
            const rows = result.findings.map((finding) =>
              `| \`${safe(finding.schema)}.${safe(finding.entity)}\` | ${safe(finding.title)} | ${safe(finding.detail)} | [Guidance](${guidance(finding.remediation)}) |`);
            const body = ['## Action required', '', `Supabase reported **${result.findings.length} non-baselined ERROR finding(s)** at ${result.checkedAt}.`, '',
              '| Entity | Finding | Detail | Guidance |', '|---|---|---|---|', ...rows, '',
              `Security Advisor: ${result.dashboardUrl}`, `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '', '_Canonical owner task: update this issue rather than opening a duplicate. The next clean scan closes it._'].join('\n');
            const existing = await findOpen(process.env.FINDINGS_TITLE);
            if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner, repo, title: process.env.FINDINGS_TITLE, body, labels: ['security-watch'] });
            await core.summary.addHeading('Supabase security watch: action required').addRaw(`${result.findings.length} finding(s).`).write();
