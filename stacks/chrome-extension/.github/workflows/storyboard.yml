name: Storyboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches: [master, main]
    paths:
      - "extension/**"
      - "storyboard/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/storyboard.yml"
  workflow_dispatch:

# Non-blocking. Renders the planned-vs-implemented storyboard from a screenshot
# of the built side panel. This stack has no server/DB, so — unlike the
# meta-layer's storyboard workflow — it just builds the extension, then runs the
# harness (no postgres, no migrate).
jobs:
  storyboard:
    name: Storyboard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and render storyboard
        # The Make target builds extension/dist before Playwright opens it.
        run: make storyboard
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storyboard
          path: storyboard/output
          if-no-files-found: ignore
