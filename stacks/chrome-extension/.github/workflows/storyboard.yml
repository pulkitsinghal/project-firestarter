name: Storyboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches: [master, main]
    paths:
      - "extension/**"
      - "storyboard/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/storyboard.yml"
  workflow_dispatch:

# Non-blocking. Renders the planned-vs-implemented storyboard from a screenshot
# of the built side panel. This stack has no server/DB, so — unlike the
# meta-layer's storyboard workflow — it just builds the extension, then runs the
# harness (no postgres, no migrate).
jobs:
  storyboard:
    name: Storyboard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and render storyboard
        # The Make target builds extension/dist before Playwright opens it.
        run: make storyboard
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storyboard
          path: storyboard/output
          if-no-files-found: ignore
