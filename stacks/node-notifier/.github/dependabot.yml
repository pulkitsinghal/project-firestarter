version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      notifier-runtime:
        patterns: ["bullmq", "express", "helmet", "ioredis", "jose", "socket.io", "socket.io-client"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /storyboard
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci
      include: scope
