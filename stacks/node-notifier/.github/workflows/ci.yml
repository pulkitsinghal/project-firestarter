name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# These display names are the Firestarter auto-merge contract. Keep them
# globally unique across workflows.
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove Docker gates see current source
        shell: bash
        working-directory: .
        run: MAKE=make MAKEFLAGS= MFLAGS= GNUMAKEFLAGS= make gate-selftest
      - name: Repository hygiene
        run: make repo-hygiene
      - name: Fast project preflight (docs, hooks, and scripts)
        run: make smoke
      - name: Unit and Redis integration suites
        # gate-selftest already ran first in this job; avoid rebuilding its
        # build-backed probe through the public aggregate target a second time.
        run: make test-run

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JavaScript syntax and module checks
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build hardened runtime image
        run: make build
