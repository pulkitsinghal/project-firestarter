name: Action Pin Catalog

# Dependabot only scans the active root .github/workflows directory for the
# github-actions ecosystem. This never-run catalog exposes every action shipped
# from template/, stacks/, and addons/ so update PRs are still raised here. The
# workflow supply-chain contract then requires every source copy to match it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Action Pin Catalog (never runs)
    if: ${{ github.event_name == 'action-pin-catalog-never-run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
