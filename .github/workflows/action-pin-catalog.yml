name: Action Pin Catalog

# Dependabot only scans the active root .github/workflows directory for the
# github-actions ecosystem. This never-run catalog exposes every action shipped
# from template/, stacks/, and addons/ so update PRs are still raised here. The
# workflow supply-chain contract then requires every source copy to match it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Action Pin Catalog (never runs)
    if: ${{ github.event_name == 'action-pin-catalog-never-run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
