name: CI

# Self-CI for the firestarter generator. Required job display names match the
# exact contract in auto-merge.yml, including both native behavior gates.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp every declared example stack and assert no leaks
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          # FIRESTARTER_NATIVE path: the runner already has python3; the
          # generator is stdlib-only. (Devs use the Docker wrapper.)
          python3 - <<'PY'
          import json
          from pathlib import Path
          declared = set(json.loads(Path("firestarter.config.json").read_text())["stack"])
          examples = {path.name.removesuffix(".answers.json") for path in Path("examples").glob("*.answers.json")}
          if declared != examples:
              raise SystemExit(f"declared stacks and examples differ: declared={sorted(declared)} examples={sorted(examples)}")
          print(f"✓ examples cover every declared stack: {', '.join(sorted(declared))}")
          PY
          for values in examples/*.answers.json; do
            ex="${values##*/}"
            ex="${ex%.answers.json}"
            python3 bin/generate.py --values "$values" --output "$OUT/$ex"
          done

          # Security-response pointers must never stamp as broken links. Keep
          # this generic document present and referenced by every stack.
          for generated in "$OUT"/*; do
            test -f "$generated/docs/SECURITY_INCIDENT_ROTATION.md"
            for guide in SECURITY.md AGENTS.md CLAUDE.md; do
              grep -Fq 'docs/SECURITY_INCIDENT_ROTATION.md' "$generated/$guide"
            done
            test -x "$generated/scripts/repo-hygiene.sh"
            test -x "$generated/scripts/mutation-check.sh"
            test -x "$generated/scripts/check-docs.sh"
            test -f "$generated/scripts/mutation-cases.sh"
            grep -Eq '^repo-hygiene:' "$generated/Makefile"
            grep -Eq '^mutation-check:' "$generated/Makefile"
            grep -Eq '^docs-check:' "$generated/Makefile"
            grep -Eq '^test:.*repo-hygiene' "$generated/Makefile"
            if grep -Eq '^(test|precommit):.*mutation-check' "$generated/Makefile"; then
              echo "::error::optional mutation-check entered a required local gate"
              exit 1
            fi
            grep -Fq 'make repo-hygiene' "$generated/.githooks/pre-commit"
            grep -Fq 'bash scripts/check-docs.sh --staged' "$generated/.githooks/pre-commit"
            awk '
              /^  tests:$/ { in_tests=1; next }
              in_tests && /^  [[:alnum:]_-]+:$/ { exit }
              in_tests && /run: make repo-hygiene/ { found=1 }
              END { exit found ? 0 : 1 }
            ' "$generated/.github/workflows/ci.yml"
            git -C "$generated" init -q
            git -C "$generated" add -A
            (cd "$generated" && bash scripts/repo-hygiene.sh --staged)
            (cd "$generated" && bash scripts/check-docs.sh)
            (cd "$generated" && bash scripts/check-docs.sh --staged)
            test "$(cd "$generated" && make mutation-check)" = \
              'mutation-check: SKIP cases=0 configured=0'
            rm -rf "$generated/.git"
          done
          echo "✓ security runbook + hygiene gate + optional mutation proof present in every stack"

          # 1. No unsubstituted tokens leaked. The only legitimate {{ matches are
          #    GitHub Actions expression syntax and JSX style={{ }} object literals.
          if grep -rIn '{{' "$OUT" | grep -vE '\$\{\{|style=\{\{'; then
            echo "::error::unsubstituted {{ token }} leaked into generated output"
            exit 1
          fi
          echo "✓ no token leaks"

          # 2. GitHub Actions expressions must survive substitution untouched.
          #    [$]{{ matches a literal dollar-brace-brace without itself being one.
          test "$(grep -c '[$]{{' "$OUT/fastapi-next/.github/workflows/auto-merge.yml")" -gt 0
          echo "✓ GitHub expressions preserved"

          # 3. Generated shell parses.
          bash -n "$OUT/fastapi-next/backend/scripts/migrate.sh"
          bash -n "$OUT/supabase-flutter/backend/scripts/migrate.sh"
          bash -n "$OUT/node-notifier/scripts/sync_version.sh"
          for stack in fastapi-next supabase-flutter chrome-extension node-notifier; do
            for h in commit-msg pre-commit pre-push; do
              sh -n "$OUT/$stack/.githooks/$h"
            done
          done
          echo "✓ generated scripts parse"

          # 4. Generated workflow YAML parses.
          python3 -m pip install --quiet pyyaml
          python3 - "$OUT" <<'PY'
          import glob, sys, yaml
          out = sys.argv[1]
          for f in glob.glob(f"{out}/*/.github/workflows/*.yml"):
              yaml.safe_load(open(f))
          print("✓ generated workflow YAML parses")
          PY

      - name: Verify the deployed-artifact contract
        run: python3 -B -m unittest -v tests.test_verify_live_contract

      - name: Verify the documentation-integrity contract
        run: python3 -B -m unittest -v tests.test_doc_integrity_contract

      - name: Verify the offline repository-hygiene contract
        run: python3 -B -m unittest -v tests.test_repo_hygiene_contract

      - name: Verify the optional mutation-proof contract
        run: python3 -B -m unittest -v tests.test_mutation_check_contract

      - name: Verify the bounded-execution runner contract
        run: python3 -B -m unittest -v tests.test_bounded_runner_contract

      - name: Verify the orchestrator-session add-on contract
        run: |
          python3 -B -m unittest -v \
            tests.test_orchestrator_control \
            tests.test_orchestrator_runtime_policy \
            tests.test_orchestrator_session_contract \
            tests.test_receipt_feed \
            tests.test_adaptive_capacity \
            tests.test_lifecycle_watchdog

      - name: Verify the Supabase Security Advisor watcher contract
        run: python3 -B -m unittest -v tests.test_supabase_security_watch_contract

      - name: Verify the synthetic service-supervisor contract
        env:
          PYTHONPATH: addons/service_supervisor/common
        run: |
          python3 -B -m unittest -v \
            tools.service_supervisor.tests.test_service_supervisor

          OUT="$(mktemp -d)"
          for values in examples/*.answers.json; do
            ex="${values##*/}"
            ex="${ex%.answers.json}"
            python3 bin/generate.py --values "$values" \
              --set include_service_supervisor=yes \
              --output "$OUT/$ex"
            test -f "$OUT/$ex/tools/service_supervisor/supervisor.py"
          done
          PYTHONPATH="$OUT/fastapi-next" python3 -B -m unittest -v \
            tools.service_supervisor.tests.test_service_supervisor

          python3 bin/generate.py --defaults --output "$OUT/off-by-default"
          test ! -e "$OUT/off-by-default/tools/service_supervisor"
          echo "✓ service supervisor is removable and off by default"

      - name: Verify the synthetic browser-automation-policy contract
        env:
          PYTHONPATH: addons/browser_automation_policy/common
        run: |
          python3 -B -m tools.browser_automation_policy.run_validation
          python3 -B -m unittest -v tests.test_browser_automation_policy_contract

          OUT="$(mktemp -d)"
          for values in examples/*.answers.json; do
            ex="${values##*/}"
            ex="${ex%.answers.json}"
            python3 bin/generate.py --values "$values" \
              --set include_browser_automation_policy=yes \
              --output "$OUT/$ex"
            test -f "$OUT/$ex/tools/browser_automation_policy/VERSION"
          done
          PYTHONPATH="$OUT/fastapi-next" python3 -B \
            -m tools.browser_automation_policy.run_validation

          python3 bin/generate.py --defaults --output "$OUT/off-by-default"
          test ! -e "$OUT/off-by-default/tools/browser_automation_policy"
          echo "✓ browser automation policy is removable and off by default"

      - name: Verify the encrypted-local-areas add-on contract
        run: |
          set -euo pipefail
          # Default-off, every-stack stamp, fail-closed guard behaviour.
          python3 -B -m unittest -v tests.test_encrypted_local_areas_contract

          OUT="$(mktemp -d)"
          for values in examples/*.answers.json; do
            ex="${values##*/}"
            ex="${ex%.answers.json}"
            python3 bin/generate.py --values "$values" \
              --set include_encrypted_local_areas=yes \
              --output "$OUT/$ex"
            test -f "$OUT/$ex/private/.gitattributes"
            test -f "$OUT/$ex/private/README.md"
            test -f "$OUT/$ex/docs/ENCRYPTED_LOCAL_AREAS.md"
            # Shipped host shell must parse: guard (bash) + superset hook (sh).
            bash -n "$OUT/$ex/scripts/git-crypt-guard.sh"
            sh -n "$OUT/$ex/.githooks/pre-commit"
          done
          # No token leaks in the add-on output (JSX/GitHub braces are the only
          # legitimate {{ matches, as in the default gate).
          if grep -rIn '{{' "$OUT" | grep -vE '\$\{\{|style=\{\{'; then
            echo "::error::token leak in encrypted-local-areas add-on output"; exit 1
          fi

          python3 bin/generate.py --defaults --output "$OUT/off-by-default"
          test ! -e "$OUT/off-by-default/private"
          echo "✓ encrypted local areas verified; off by default"

      - name: Verify the trusted-workstation security contract
        run: |
          python3 -m pip install --quiet 'jsonschema>=4.18,<5'
          python3 -B -m unittest -v tests.test_trusted_workstation_contract

      - name: Verify the local-ollama add-on contract
        run: |
          set -euo pipefail
          # Off by default, every-stack stamp with tokens substituted, and the
          # stamped client's offline transport self-test (no network).
          python3 -B -m unittest -v tests.test_local_ollama_contract

          OUT="$(mktemp -d)"
          for values in examples/*.answers.json; do
            ex="${values##*/}"
            ex="${ex%.answers.json}"
            python3 bin/generate.py --values "$values" \
              --set include_local_ollama=yes \
              --output "$OUT/$ex"
            test -f "$OUT/$ex/local-ollama/python/local_ollama_client.py"
            test -f "$OUT/$ex/local-ollama/swift/LocalOllamaClient.swift"
            test -f "$OUT/$ex/docs/LOCAL_OLLAMA.md"
            # Stamped Python client parses and passes its offline self-test.
            python3 -m py_compile "$OUT/$ex/local-ollama/python/local_ollama_client.py"
            python3 -B "$OUT/$ex/local-ollama/python/selftest.py"
          done
          if grep -rIn '{{' "$OUT" | grep -vE '\$\{\{|style=\{\{'; then
            echo "::error::token leak in local-ollama add-on output"; exit 1
          fi

          python3 bin/generate.py --defaults --output "$OUT/off-by-default"
          test ! -e "$OUT/off-by-default/local-ollama"
          echo "✓ local ollama client verified; off by default"

      - name: Stamp the optional k8s add-on for server-backed stacks
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          for stack in fastapi-next supabase-flutter; do
            python3 bin/generate.py --defaults \
              --set stack=$stack --set project_slug=k8stest --set include_k8s=yes \
              --output "$OUT/$stack"
            test -f "$OUT/$stack/k8s/base/kustomization.yaml" \
              || { echo "::error::k8s add-on not stamped for $stack"; exit 1; }
          done
          # No leaks in the add-on output either.
          if grep -rIn '{{' "$OUT" | grep -vE '\$\{\{|style=\{\{'; then
            echo "::error::token leak in k8s add-on output"; exit 1
          fi
          # All k8s YAML parses (multi-doc).
          python3 - "$OUT" <<'PY'
          import glob, sys, yaml
          n = 0
          for f in glob.glob(f"{sys.argv[1]}/*/k8s/**/*.yaml", recursive=True):
              list(yaml.safe_load_all(open(f))); n += 1
          print(f"✓ k8s add-on: {n} YAML files parse, no leaks")
          PY

      - name: Confirm k8s is OFF by default
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          python3 bin/generate.py --defaults --set project_slug=nok8s --output "$OUT/d"
          test ! -d "$OUT/d/k8s" && echo "✓ k8s absent unless include_k8s=yes"

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile the generator
        run: python3 -m py_compile bin/generate.py

      - name: Shell-check the entrypoint
        run: bash -n bin/firestart.sh

      - name: Validate firestarter's own workflow YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml
          for f in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(f))
          print("✓ workflow YAML parses")
          PY

  trusted-workstation-macos:
    name: Trusted Workstation macOS Behavior
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run schema and native JXA behavior contracts
        run: |
          /bin/bash -c '[[ ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]} == 3.2 ]]'
          VENV="$RUNNER_TEMP/trusted-workstation-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --quiet 'jsonschema==4.25.1'
          /bin/bash tests/trusted_workstation_macos.sh
          "$VENV/bin/python" -B -m unittest -v tests.test_trusted_workstation_contract
          REPO_HYGIENE_BASH=/bin/bash \
            "$VENV/bin/python" -B -m unittest -v tests.test_repo_hygiene_contract
          MUTATION_CHECK_BASH=/bin/bash \
            "$VENV/bin/python" -B -m unittest -v tests.test_mutation_check_contract
          DOC_CHECK_BASH=/bin/bash \
            "$VENV/bin/python" -B -m unittest -v tests.test_doc_integrity_contract

  trusted-workstation-windows:
    name: Trusted Workstation Windows Behavior
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run schema and native WSH/PowerShell behavior contracts
        shell: powershell
        run: |
          python -m pip install --quiet 'jsonschema==4.25.1'
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\trusted_workstation_windows.ps1
          python -B -m unittest -v tests.test_trusted_workstation_contract
