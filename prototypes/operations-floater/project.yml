name: OperationsFloater
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OperationsFloater:
    type: application
    platform: macOS
    sources:
      - path: Sources/OperationsFloater
