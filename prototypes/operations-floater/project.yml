name: OperationsFloater
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OperationsFloater:
    type: application
    platform: macOS
    sources:
      - path: Sources/OperationsFloater
    resources:
      - path: Assets.xcassets
    info:
      path: Info.plist
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: OperationsFloater.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pulkitsinghal.operationsfloater
        PRODUCT_NAME: Operations Floater
        GENERATE_INFOPLIST_FILE: NO
