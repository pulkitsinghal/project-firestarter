name: OperationsFloater
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OperationsFloater:
    type: application
    platform: macOS
    sources:
      - path: Sources/OperationsFloater
      - path: Assets.xcassets
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Start Voice Conversation uses the microphone only while you explicitly listen.
        NSSpeechRecognitionUsageDescription: Voice Conversation requires on-device speech recognition and keeps transcripts ephemeral.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: OperationsFloater.entitlements
        # Developer ID (direct) distribution posture; the App Sandbox is not
        # required off the Mac App Store. Hardened Runtime stays on. See docs/SIGNING.md.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.operationsfloater
        PRODUCT_NAME: Operations Floater
        GENERATE_INFOPLIST_FILE: NO
