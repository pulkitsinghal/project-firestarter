name: Narration Audio Sync

# Weekly drift check: is the vendored kokoro_warm component still identical to the
# one maintained in project-firestarter? If it has drifted (someone hand-edited
# the local copy, or firestarter moved on), open ONE tracking issue so a human
# re-runs scripts/sync-kokoro-warm.sh. Read-only except for that issue.
#
# This is a nudge, not a merge gate — it never blocks a PR.

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Narration Audio Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the vendored component against firestarter
        id: check
        continue-on-error: true
        run: bash scripts/sync-kokoro-warm.sh --check
      - name: Open a tracking issue on drift (deduplicated by title)
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "kokoro_warm: vendored narration audio has drifted from firestarter"
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "tracking issue already open — nothing to do"
            exit 0
          fi
          gh issue create --title "$TITLE" --body \
            "The scheduled drift check found the vendored **kokoro_warm** narration audio component no longer matches project-firestarter (or the check could not reach firestarter). Re-pull the standard with \`scripts/sync-kokoro-warm.sh\` and commit, or reconcile the change upstream. See \`docs/KOKORO_WARM.md\`."
