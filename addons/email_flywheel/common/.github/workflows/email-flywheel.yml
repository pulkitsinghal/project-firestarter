name: Email Flywheel

# Opt-in growth "flywheel": on a recurring routine (or manual dispatch) an AI agent
# reads what actually shipped in this repo (merged PRs in the window), drafts one
# short, honest update email, and — when the operator has wired their own mailbox —
# sends it to a stakeholder / subscriber list. Momentum → outbound update →
# engagement → more momentum. The email sibling of the Scheduled Agent add-on
# (which drops a GitHub issue instead).
#
# Runs in GitHub's cloud, independent of any local machine, reusing the existing
# ANTHROPIC_API_KEY repo secret (the same one the AI PR reviewer uses).
#
# Safe by default: with no SMTP_* secrets set it only *drafts* the email and writes
# the preview to the run summary (a dry run — nothing is sent). Sending turns on
# only once you add your own SMTP secrets (see docs/EMAIL_FLYWHEEL.md).
#
# Trigger: manual by default (Actions tab → "Run workflow"). To make it the
# recurring routine, uncomment the `schedule` block below — each run costs a small
# API charge, so it is left OFF until you opt in.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 13 * * 1'   # every Monday ~13:00 UTC. Uncomment to run the routine.

# Least-privilege: read the repo + list merged PRs. The dry-run preview goes to the
# run summary (no write scope needed), and sending email talks to your SMTP server,
# not the GitHub API — so no write permission anywhere.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: email-flywheel
  cancel-in-progress: false

jobs:
  flywheel:
    name: Draft + send the flywheel email
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Draft the update and (if configured) send it
        run: node scripts/email-flywheel.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODEL: ${{ vars.CLAUDE_MODEL || '{{ claude_model }}' }}
          AGENT_PROMPT_FILE: .github/agent/email-flywheel.prompt.md
          # How far back to look for shipped work (merged PRs). Defaults to 7 days.
          FLYWHEEL_WINDOW_DAYS: ${{ vars.FLYWHEEL_WINDOW_DAYS }}
          # --- Delivery (all optional): leave unset for a dry run (draft only) ---
          # Comma-separated recipient list. Sending is skipped unless this is set.
          FLYWHEEL_RECIPIENTS: ${{ vars.FLYWHEEL_RECIPIENTS }}
          # Your own outbound mailbox (no third-party subscription required).
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ vars.SMTP_SENDER }}
