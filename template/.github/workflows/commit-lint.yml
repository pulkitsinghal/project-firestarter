name: Commit Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches: [master, main]
    types: [opened, reopened, synchronize, edited, labeled, ready_for_review]

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate history as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-history
          fetch-depth: 0
          persist-credentials: false

      - name: Validate issue-closing intent and commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          umask 077
          TITLE_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$TITLE_FILE" "$BODY_FILE"' EXIT HUP INT TERM
          printf '%s' "$PR_TITLE" >"$TITLE_FILE"
          printf '%s' "$PR_BODY" >"$BODY_FILE"

          CHECKER="$GITHUB_WORKSPACE/trusted-base/scripts/check-closing-keywords.sh"
          COMMIT_REPO="$GITHUB_WORKSPACE/candidate-history"
          (
            cd "$COMMIT_REPO"
            sh "$CHECKER" \
              --commit-range "${BASE_SHA}..${HEAD_SHA}" \
              --pr-title-file "$TITLE_FILE" \
              --pr-body-file "$BODY_FILE"
          )

          COMMITS=$(git -C "$COMMIT_REPO" rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "${COMMITS}" ]; then
            echo "No commits to validate."
            exit 0
          fi

          # Subject ≤100 chars after the type/scope prefix. Aim for 72; the
          # softer cap keeps summary-heavy docs commits from blocking CI.
          PATTERN='^(feat|fix|refactor|chore|docs|test|ci|build)(\([a-z0-9._,/-]+\))?!?: .{1,100}$'

          STATUS=0
          for sha in ${COMMITS}; do
            subject=$(git -C "$COMMIT_REPO" log -1 --format=%s "${sha}")

            # Skip machine-generated commits that don't follow conventional format.
            case "${subject}" in
              Revert\ *|Merge\ *|fixup!\ *|squash!\ *) continue ;;
            esac

            if ! echo "${subject}" | grep -Eq "${PATTERN}"; then
              echo "::error::A commit subject does not match Conventional Commits."
              echo "Expected: <type>(<scope>): <subject>  (types: feat fix refactor chore docs test ci build)"
              STATUS=1
            fi
          done

          exit ${STATUS}
