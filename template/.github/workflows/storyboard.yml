name: Storyboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Non-blocking visual regression aid: boots the stack, drives the UI with
# Playwright, and uploads the screenshot storyboard as a build artifact.

on:
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"
      - "app/**"
      - "splash/**"
      - "storyboard/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/storyboard.yml"
  workflow_dispatch:

jobs:
  storyboard:
    name: Generate storyboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate storyboard
        # The stack-owned target rebuilds, prepares, and boots the exact
        # production artifact. Do not duplicate a dev-server command here.
        run: make storyboard

      - name: Upload storyboard artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storyboard
          path: storyboard/output/*.png
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose down -v
